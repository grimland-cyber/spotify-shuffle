<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>ערבוב אמיתי</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #121212; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 24px; text-align: center;
    -webkit-user-select: none; user-select: none;
  }
  h1 { font-size: 30px; font-weight: 700; }
  .pl { color: #b3b3b3; font-size: 15px; direction: ltr; }
  #go {
    width: min(78vw, 330px); aspect-ratio: 1 / 1; border-radius: 50%;
    border: none; cursor: pointer;
    background: #1DB954; color: #0a0a0a;
    font-size: 30px; font-weight: 800; font-family: inherit;
    box-shadow: 0 12px 40px rgba(29,185,84,.35);
    transition: transform .08s ease, background .2s;
    touch-action: manipulation;
  }
  #go:active { transform: scale(.96); }
  #go:disabled { background: #2a2a2a; color: #777; box-shadow: none; cursor: default; }
  #status { min-height: 52px; font-size: 17px; line-height: 1.5; color: #d7d7d7; white-space: pre-line; }
  #status.ok { color: #1DB954; font-weight: 700; font-size: 19px; }
  #status.err { color: #ff6b6b; }
  .hint { position: fixed; bottom: 14px; font-size: 11px; color: #555; }
</style>
</head>
<body>
  <h1>🎲 ערבוב אמיתי</h1>
  <div class="pl">My playlist #21</div>
  <button id="go">ערבב<br>עכשיו</button>
  <div id="status">לחיצה אחת = סדר אקראי אמיתי לכל הפלייליסט</div>
  <div class="hint">Fisher-Yates + crypto.getRandomValues</div>
<script>
'use strict';
const CLIENT_ID = 'e0fbcc1966fd4b5dbda9b28549baba50';
const REDIRECT_URI = 'https://grimland-cyber.github.io/spotify-shuffle/';
const PLAYLIST_ID = '5xZofyUruG5M3mtj2MvFWB';
const SCOPES = 'playlist-read-private playlist-modify-public playlist-modify-private';
const LS = 'ts_auth';

const $ = id => document.getElementById(id);
function setStatus(t, cls){ const s = $('status'); s.textContent = t; s.className = cls || ''; }

/* ---------- PKCE OAuth ---------- */
function b64url(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function startAuth(){
  const v = b64url(crypto.getRandomValues(new Uint8Array(64)));
  const ch = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  localStorage.setItem('ts_verifier', v);
  const p = new URLSearchParams({
    client_id: CLIENT_ID, response_type: 'code', redirect_uri: REDIRECT_URI,
    scope: SCOPES, code_challenge_method: 'S256', code_challenge: ch
  });
  location.href = 'https://accounts.spotify.com/authorize?' + p;
}
async function tokenRequest(body){
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: new URLSearchParams({client_id: CLIENT_ID, ...body})
  });
  if(!r.ok) throw new Error('token ' + r.status);
  const d = await r.json();
  const cur = JSON.parse(localStorage.getItem(LS) || '{}');
  localStorage.setItem(LS, JSON.stringify({
    access: d.access_token,
    refresh: d.refresh_token || cur.refresh,
    exp: Date.now() + (d.expires_in - 60) * 1000
  }));
}
async function handleCallback(){
  const q = new URLSearchParams(location.search);
  if(q.get('error')){ setStatus('ההתחברות בוטלה — נסה שוב', 'err'); history.replaceState({},'',REDIRECT_URI); return; }
  const code = q.get('code');
  if(!code) return;
  setStatus('משלים התחברות…');
  await tokenRequest({grant_type:'authorization_code', code,
    redirect_uri: REDIRECT_URI, code_verifier: localStorage.getItem('ts_verifier')});
  history.replaceState({}, '', REDIRECT_URI);
  setStatus('מחובר! לחץ על הכפתור כדי לערבב', 'ok');
}
async function getToken(){
  const a = JSON.parse(localStorage.getItem(LS) || 'null');
  if(!a) return null;
  if(Date.now() < a.exp) return a.access;
  await tokenRequest({grant_type:'refresh_token', refresh_token: a.refresh});
  return JSON.parse(localStorage.getItem(LS)).access;
}

/* ---------- Spotify API ---------- */
async function api(path, opts, retried){
  const t = await getToken();
  const r = await fetch('https://api.spotify.com/v1' + path, {
    ...opts,
    headers: {'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json', ...(opts&&opts.headers)}
  });
  if(r.status === 429){
    await new Promise(res => setTimeout(res, (parseInt(r.headers.get('Retry-After')||'2')+0.5)*1000));
    return api(path, opts, retried);
  }
  if(r.status === 401 && !retried){
    localStorage.removeItem(LS);
    return api(path, opts, true);
  }
  if(!r.ok) throw new Error('api ' + r.status);
  return r.status === 204 ? {} : r.json();
}

/* ---------- True shuffle ---------- */
function randInt(n){
  const limit = Math.floor(0x100000000 / n) * n;
  const b = new Uint32Array(1);
  do { crypto.getRandomValues(b); } while (b[0] >= limit);
  return b[0] % n;
}
async function shuffle(){
  setStatus('טוען שירים…');
  const uris = [];
  let offset = 0, total = 0;
  for(;;){
    const d = await api(`/v1/playlists/${PLAYLIST_ID}/tracks?limit=100&offset=${offset}&fields=items(track(uri)),total`);
    total = d.total;
    for(const it of d.items) if(it.track && it.track.uri) uris.push(it.track.uri);
    setStatus(`טוען שירים… ${uris.length} מתוך ${total}`);
    if(!d.items.length || uris.length >= total) break;
    offset += 100;
  }
  for(let i = uris.length - 1; i > 0; i--){
    const j = randInt(i + 1);
    [uris[i], uris[j]] = [uris[j], uris[i]];
  }
  setStatus('כותב סדר חדש…');
  await api(`/v1/playlists/${PLAYLIST_ID}/tracks`, {method:'PUT', body: JSON.stringify({uris: uris.slice(0,100)})});
  for(let i = 100; i < uris.length; i += 100){
    await api(`/v1/playlists/${PLAYLIST_ID}/tracks`, {method:'POST', body: JSON.stringify({uris: uris.slice(i, i+100)})});
    setStatus(`כותב סדר חדש… ${Math.min(i+100, uris.length)} מתוך ${uris.length}`);
  }
  setStatus(`✅ הפלייליסט עורבב!\n${uris.length} שירים בסדר אקראי אמיתי`, 'ok');
}

$('go').addEventListener('click', async () => {
  const btn = $('go'); btn.disabled = true;
  try{
    if(!await getToken()){ await startAuth(); return; }
    await shuffle();
  }catch(e){
    console.error(e);
    setStatus('משהו השתבש — נסה שוב בעוד רגע', 'err');
  }finally{
    btn.disabled = false;
  }
});
handleCallback().catch(e => { console.error(e); setStatus('ההתחברות נכשלה — נסה שוב', 'err'); });
</script>
</body>
</html>
